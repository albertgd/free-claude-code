name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build macOS binaries
        run: |
          npx @yao-pkg/pkg dist/index.js \
            --targets node22-macos-arm64,node22-macos-x64 \
            --out-path binaries \
            --options no-deprecation

      - name: Rename and chmod binaries
        run: |
          echo "=== binaries/ contents ==="
          ls -lh binaries/
          # pkg names output after the input file (index) or the package name
          # Try all known naming patterns
          for src in binaries/index-macos-arm64 binaries/dist-macos-arm64; do
            [ -f "$src" ] && mv "$src" binaries/fcc-macos-arm64 && break || true
          done
          for src in binaries/index-macos-x64 binaries/dist-macos-x64; do
            [ -f "$src" ] && mv "$src" binaries/fcc-macos-x64 && break || true
          done
          echo "=== after rename ==="
          ls -lh binaries/
          chmod +x binaries/fcc-macos-arm64 binaries/fcc-macos-x64

      - name: Compute SHA256 checksums
        id: sha
        run: |
          echo "arm64=$(shasum -a 256 binaries/fcc-macos-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x64=$(shasum -a 256 binaries/fcc-macos-x64   | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            binaries/fcc-macos-arm64
            binaries/fcc-macos-x64

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
          SHA256_ARM64: ${{ steps.sha.outputs.arm64 }}
          SHA256_X64: ${{ steps.sha.outputs.x64 }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/albertgd/homebrew-tap.git" tap-repo
          python3 scripts/update-formula.py
          cd tap-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add Formula/fcc.rb
          git commit -m "fcc ${VERSION}"
          git push
